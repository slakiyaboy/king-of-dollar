<!DOCTYPE html>
<html>
<head>
<title>King Of Dollar</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>

<body>

<!-- 🎬 WELCOME -->
<div id="welcome">
<h1 class="title">💰 KING OF DOLLAR</h1>
<p class="sub">Earn Smart. Live Better.</p>
</div>

<!-- AUTH -->
<div id="authPage" class="hidden">

<div id="loginBox">
<h2>Login</h2>
<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p onclick="showSignup()">Create Account</p>
</div>

<div id="signupBox" class="hidden">
<h2>Create Account</h2>
<input id="name" placeholder="Name">
<input id="username" placeholder="Username">
<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">
<button onclick="signup()">Signup</button>
<p onclick="showLogin()">Back to Login</p>
</div>

</div>

<!-- MAIN -->
<div id="mainPage" class="hidden">

<h2>Welcome <span id="user"></span></h2>

<h1 id="balance">$0.00</h1>

<button onclick="watchAd()">WATCH AD</button>

<br><br>

<input id="amount" type="number" placeholder="Withdraw">
<button onclick="withdraw()">Withdraw</button>

</div>

<!-- AD -->
<div id="ad" class="hidden">
<p>Ad Running...</p>
<p>Wait <span id="t">5</span>s</p>
<button id="close" class="hidden" onclick="reward()">CLOSE</button>
</div>

</body>
</html>
