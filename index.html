<!DOCTYPE html>
<html>
<head>
<title>Earning App</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>

<body>

<!-- 🎬 WELCOME SCREEN -->
<div id="welcome">
<h1 class="fade">👋 WELCOME</h1>
<p class="fade2">KING OF EARN APP</p>
</div>

<!-- AUTH -->
<div id="authPage" class="hidden">

<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">

<button onclick="login()">Login</button>
<button onclick="signup()">Signup</button>

</div>

<!-- MAIN -->
<div id="mainPage" class="hidden">

<h2>Welcome <span id="user"></span></h2>

<h1 id="balance">$0.00</h1>

<button onclick="watchAd()">WATCH AD</button>

<br><br>

<input id="amount" type="number" placeholder="Withdraw">
<button onclick="withdraw()">Withdraw</button>

</div>

<!-- AD -->
<div id="ad" class="hidden">
<p>Ad Running...</p>
<p>Wait <span id="t">5</span>s</p>
<button id="close" class="hidden" onclick="reward()">CLOSE</button>
</div>

</body>
</html>
