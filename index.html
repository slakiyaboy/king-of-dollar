<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>King Of Dollar</title>

  <link rel="stylesheet" href="style.css">

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      sendEmailVerification
    } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

    import {
      getDatabase,
      ref,
      set,
      get,
      child,
      update
    } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAifKKpluXjlOOjnhCSL2fSCj4urp5ZFN4",
      authDomain: "king-of-dollar.firebaseapp.com",
      databaseURL: "https://king-of-dollar-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "king-of-dollar",
      storageBucket: "king-of-dollar.firebasestorage.app",
      messagingSenderId: "289594893517",
      appId: "1:289594893517:web:c12a017bc02e06ca7cb584",
      measurementId: "G-LHHS2J9F20"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    window.signup = async function () {

      const name = document.getElementById("signupName").value;
      const username = document.getElementById("signupUsername").value;
      const email = document.getElementById("signupEmail").value;
      const password = document.getElementById("signupPassword").value;

      if (!name || !username || !email || !password) {
        alert("Fill all fields");
        return;
      }

      try {

        const userCredential = await createUserWithEmailAndPassword(auth, email, password);

        const user = userCredential.user;

        await sendEmailVerification(user);

        await set(ref(db, 'users/' + user.uid), {
          name: name,
          username: username,
          email: email,
          balance: 0,
          todayEarn: 0
        });

        alert("Account created. Verify your email.");

      } catch (error) {
        alert(error.message);
      }
    }

    window.login = async function () {

      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;

      try {

        const userCredential = await signInWithEmailAndPassword(auth, email, password);

        const user = userCredential.user;

        if (!user.emailVerified) {
          alert("Verify your email first");
          return;
        }

        const dbRef = ref(db);

        get(child(dbRef, 'users/' + user.uid)).then((snapshot) => {

          if (snapshot.exists()) {

            const data = snapshot.val();

            document.getElementById("authPage").style.display = "none";
            document.getElementById("mainPage").style.display = "block";

            document.getElementById("balance").innerText =
              "$" + Number(data.balance).toFixed(2);

            document.getElementById("welcomeUser").innerText =
              data.username;

          }

        });

      } catch (error) {
        alert(error.message);
      }
    }

    window.watchAd = async function () {

      alert("Watching ad...");

      setTimeout(async () => {

        const user = auth.currentUser;

        const dbRef = ref(db);

        const snapshot = await get(child(dbRef, 'users/' + user.uid));

        const data = snapshot.val();

        const newBalance = Number(data.balance) + 0.01;

        await update(ref(db, 'users/' + user.uid), {
          balance: newBalance
        });

        document.getElementById("balance").innerText =
          "$" + newBalance.toFixed(2);

        alert("$0.01 added");

      }, 5000);

    }

    window.withdraw = async function () {

      const amount = Number(document.getElementById("withdrawAmount").value);

      const binance = document.getElementById("binanceEmail").value;

      const user = auth.currentUser;

      const dbRef = ref(db);

      const snapshot = await get(child(dbRef, 'users/' + user.uid));

      const data = snapshot.val();

      if (amount > data.balance) {
        alert("Insufficient balance");
        return;
      }

      const newBalance = data.balance - amount;

      await update(ref(db, 'users/' + user.uid), {
        balance: newBalance
      });

      await set(ref(db, 'withdraws/' + Date.now()), {
        uid: user.uid,
        email: data.email,
        binance: binance,
        amount: amount,
        status: "pending"
      });

      document.getElementById("balance").innerText =
        "$" + newBalance.toFixed(2);

      alert("Withdraw request submitted");

    }

  </script>
</head>

<body>

<div id="welcomePage">

  <div class="coins"></div>

  <h1>KING OF DOLLAR</h1>

  <button onclick="goAuth()">NEXT</button>

</div>

<div id="authPage" style="display:none;">

  <div class="box">

    <h2>LOGIN</h2>

    <input type="email" id="loginEmail" placeholder="Email">
    <input type="password" id="loginPassword" placeholder="Password">

    <button onclick="login()">LOGIN</button>

    <p onclick="showSignup()">Create Account</p>

  </div>

  <div class="box" id="signupBox" style="display:none;">

    <h2>SIGN UP</h2>

    <input type="text" id="signupName" placeholder="Full Name">
    <input type="text" id="signupUsername" placeholder="Username">
    <input type="email" id="signupEmail" placeholder="Email">
    <input type="password" id="signupPassword" placeholder="Password">

    <button onclick="signup()">CREATE ACCOUNT</button>

  </div>

</div>

<div id="mainPage" style="display:none;">

  <div class="topBar">
    Welcome, <span id="welcomeUser"></span>
  </div>

  <div class="balanceCard">
    <h2 id="balance">$0.00</h2>
    <p>Available Balance</p>
  </div>

  <button class="earnBtn" onclick="watchAd()">
    WATCH & EARN
  </button>

  <div class="walletBox">

    <h3>Withdraw</h3>

    <input type="number" id="withdrawAmount" placeholder="Amount">

    <input type="email" id="binanceEmail" placeholder="Binance Email">

    <button onclick="withdraw()">WITHDRAW</button>

  </div>

</div>

<script>

function goAuth() {
  document.getElementById("welcomePage").style.display = "none";
  document.getElementById("authPage").style.display = "flex";
}

function showSignup() {
  document.getElementById("signupBox").style.display = "block";
}

</script>

</body>
</html>
