<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>King Of Dollar</title>

<link rel="stylesheet" href="style.css">

<script type="module" src="app.js"></script>

</head>

<body>

<!-- 🎬 WELCOME -->
<div id="welcome">

<h1 class="logo">💰 KING OF DOLLAR</h1>

<p>Secure Earning Platform</p>

</div>

<!-- 🔐 AUTH -->
<div id="authPage" style="display:none;">

<div class="authBox">

<h2>Login / Signup</h2>

<input type="email" id="email" placeholder="Email">

<input type="password" id="pass" placeholder="Password">

<button onclick="login()">LOGIN</button>

<button onclick="signup()">SIGNUP</button>

</div>

</div>

<!-- 🏠 MAIN -->
<div id="mainPage" style="display:none;">

<h2>
Welcome,
<span id="user"></span>
</h2>

<div class="balanceBox">

<h1 id="balance">$0.00</h1>

<p>Available Balance</p>

</div>

<button
id="watchBtn"
class="earnBtn"
onclick="watchAd()">

WATCH AD & EARN

</button>

<p id="cooldownText"></p>

<div class="withdrawBox">

<h3>Withdraw</h3>

<input
type="number"
id="amount"
placeholder="Amount">

<button onclick="withdraw()">
SEND REQUEST
</button>

</div>

<button class="logoutBtn" onclick="logout()">
LOGOUT
</button>

</div>

<!-- 🎬 AD -->
<div id="ad" style="display:none;">

<div class="adBox">

<h2>ADVERTISEMENT</h2>

<p>
Please wait
<span id="t">5</span>s
</p>

<button
id="close"
style="display:none;"
onclick="reward()">

CLOSE

</button>

</div>

</div>

</body>

</html>
